name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install skill-validator
        run: |
          set -euo pipefail
          VERSION=1.5.4
          URL="https://github.com/agent-ecosystem/skill-validator/releases/download/v${VERSION}/skill-validator_${VERSION}_linux_amd64.tar.gz"
          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT
          curl -fsSL "$URL" -o "$TMPDIR/skill-validator.tar.gz"
          tar -xzf "$TMPDIR/skill-validator.tar.gz" -C "$TMPDIR"
          install -m 0755 "$TMPDIR/skill-validator" /usr/local/bin/skill-validator

      - name: Validate skills
        run: skill-validator check --strict skills
